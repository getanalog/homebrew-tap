# Bump the formula to a new analog-sdk version and open a PR — or, when
# the version is already current but a transitive release moved a
# pinned resource, open the refresh PR instead.
#
# Normally dispatched by the maintainer right after a PyPI release:
#   gh workflow run bump.yml -R getanalog/homebrew-tap
# The daily poller (poll.yml) calls this too, in case that's forgotten
# and whenever the resource set drifts.
#
# Needs "Allow GitHub Actions to create and approve pull requests"
# enabled under Settings -> Actions -> General.
name: Bump formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "analog-sdk version to pin (empty = latest on PyPI)"
        required: false
        default: ""
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INPUT_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: true # this job pushes the bump branch
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # ratchet:astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Regenerate the formula
        run: |
          set -euo pipefail
          grep -oE 'analog_sdk-[0-9][^-]*' Formula/analog.rb | head -1 | cut -d- -f2 > /tmp/before-version
          if [ -n "$INPUT_VERSION" ]; then
            uv run --with packaging python scripts/regenerate.py --version "$INPUT_VERSION"
          else
            uv run --with packaging python scripts/regenerate.py --latest
          fi
      - name: Open the bump PR
        run: |
          set -euo pipefail
          if git diff --quiet Formula/analog.rb; then
            echo "already current, nothing to do"
            exit 0
          fi
          VERSION="$(grep -oE 'analog_sdk-[0-9][^-]*' Formula/analog.rb | head -1 | cut -d- -f2)"
          BEFORE="$(cat /tmp/before-version)"
          if [ "$VERSION" = "$BEFORE" ]; then
            # Same analog-sdk version, different resource set: a
            # transitive release moved a pinned wheel. Name it as the
            # refresh it is, not a version bump.
            BRANCH="refresh/resources"
            TITLE="fix(formula): refresh resolved resources"
            BODY="Resolved resources drifted since the last regeneration (analog-sdk stays at $VERSION). Regenerated by the poller; CI does the real proving: audit, install, smoke, and the generator diff."
          else
            BRANCH="bump/analog-sdk-$VERSION"
            TITLE="analog $VERSION"
            BODY="Regenerated for analog-sdk $VERSION. CI does the real proving: audit, install, smoke, and the generator diff."
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add Formula/analog.rb
          git commit -m "$TITLE"
          git push -u origin "$BRANCH" --force
          gh pr create \
            --title "$TITLE" \
            --body "$BODY" \
            || echo "PR already open for $BRANCH"
