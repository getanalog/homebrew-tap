# Daily check that the formula hasn't fallen behind PyPI — a newer
# analog-sdk, or a transitive release that moved a pinned resource. If
# it has, run the same bump the maintainer would have dispatched; the
# bump names its PR a version bump or a resource refresh accordingly.
name: Poll PyPI

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lagging: ${{ steps.check.outputs.lagging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # ratchet:astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: false
      - name: Compare the formula pin and resources against PyPI
        id: check
        run: |
          set -euo pipefail
          if uv run --with packaging python scripts/regenerate.py --check; then
            echo "lagging=false" >> "$GITHUB_OUTPUT"
          else
            echo "lagging=true" >> "$GITHUB_OUTPUT"
          fi

  bump:
    needs: check
    if: needs.check.outputs.lagging == 'true'
    uses: ./.github/workflows/bump.yml
    permissions:
      contents: write
      pull-requests: write
